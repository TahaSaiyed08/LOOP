<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="THESIS. Read the news behind every pick. Daily research for first-time investors.">
  <title>THESIS. Read the news behind every pick.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d1a"/>
      <stop offset="1" stop-color="#0c0f0e"/>
    </linearGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="0.25" stop-color="#f5d96c"/>
      <stop offset="0.5" stop-color="#d7b94e"/>
      <stop offset="0.75" stop-color="#f4f1e8"/>
      <stop offset="1" stop-color="#f4f1e8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73c998" stop-opacity=".35"/>
      <stop offset="1" stop-color="#73c998" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7b94e"/>
      <stop offset="1" stop-color="#73c998"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="28"/></clipPath>
    <clipPath id="type"><rect x="60" y="212" width="0" height="42"><animate attributeName="width" values="0;560;560;0" keyTimes="0;0.35;0.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .grid { stroke: #ffffff; stroke-opacity: .05; stroke-dasharray: 3 9; animation: gridmove 3s linear infinite; }
    @keyframes gridmove { to { stroke-dashoffset: -24; } }
    .trace { stroke-dasharray: 100; animation: trace 7s ease-in-out infinite; }
    @keyframes trace { 0% { stroke-dashoffset: 100; opacity: 1; } 65%,92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .areafade { animation: areafade 7s ease-in-out infinite; }
    @keyframes areafade { 0%,45% { opacity: 0; } 70%,92% { opacity: 1; } 100% { opacity: 0; } }
    .pill { animation: drift 6s ease-in-out infinite; }
    .pill2 { animation: drift 6s ease-in-out -2s infinite; }
    .pill3 { animation: drift 6s ease-in-out -4s infinite; }
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .ring { stroke-dasharray: 100; animation: ring 7s ease-in-out infinite; }
    @keyframes ring { 0% { stroke-dashoffset: 100; } 40%,90% { stroke-dashoffset: 19; } 100% { stroke-dashoffset: 100; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.8); opacity: .1; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>

    <!-- drifting aurora -->
    <circle cx="180" cy="80" r="150" fill="#d7b94e" opacity=".22" filter="url(#blur)">
      <animate attributeName="cx" values="180;340;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;150;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="300" r="170" fill="#73c998" opacity=".20" filter="url(#blur)">
      <animate attributeName="cx" values="1020;860;1020" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;220;300" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- moving grid -->
    <g>
      <line class="grid" x1="0" y1="70" x2="1200" y2="70"/>
      <line class="grid" x1="0" y1="140" x2="1200" y2="140"/>
      <line class="grid" x1="0" y1="210" x2="1200" y2="210"/>
      <line class="grid" x1="0" y1="280" x2="1200" y2="280"/>
      <line class="grid" x1="0" y1="350" x2="1200" y2="350"/>
    </g>

    <!-- eyebrow -->
    <text x="62" y="76" font-size="15" font-weight="700" fill="#d7b94e" letter-spacing="4.5">DAILY MARKET RESEARCH FOR FIRST-TIME INVESTORS</text>

    <!-- title -->
    <text x="56" y="196" font-size="124" font-weight="900" letter-spacing="-3" fill="url(#title)" textLength="540" lengthAdjust="spacingAndGlyphs">THESIS</text>

    <!-- typed tagline -->
    <g clip-path="url(#type)">
      <text x="62" y="244" font-size="30" font-weight="600" fill="#f4f1e8">Read the news behind every pick.</text>
    </g>

    <!-- floating pills -->
    <g transform="translate(62,280)"><g class="pill">
      <rect width="118" height="36" rx="18" fill="#18281f" stroke="#73c998" stroke-opacity=".6"/>
      <circle cx="20" cy="18" r="5" fill="#73c998"/>
      <text x="34" y="24" font-size="16" font-weight="600" fill="#bfe8cf">Bull case</text>
    </g></g>
    <g transform="translate(194,280)"><g class="pill2">
      <rect width="118" height="36" rx="18" fill="#2d1b1c" stroke="#ef8c82" stroke-opacity=".6"/>
      <circle cx="20" cy="18" r="5" fill="#ef8c82"/>
      <text x="34" y="24" font-size="16" font-weight="600" fill="#f6c3bd">Bear case</text>
    </g></g>
    <g transform="translate(326,280)"><g class="pill3">
      <rect width="142" height="36" rx="18" fill="#2b2410" stroke="#d7b94e" stroke-opacity=".6"/>
      <circle cx="20" cy="18" r="5" fill="#d7b94e"/>
      <text x="34" y="24" font-size="16" font-weight="600" fill="#f2dd8d">Overall read</text>
    </g></g>

    <text x="62" y="350" font-size="14" fill="#a9b0a8" letter-spacing="1">Educational research, not investment advice.</text>

    <!-- right side: match score ring -->
    <g transform="translate(1058,96)">
      <circle r="44" fill="#141917" stroke="#303731" stroke-width="7"/>
      <circle class="ring" r="44" pathLength="100" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" transform="rotate(-90)"/>
      <text y="9" text-anchor="middle" font-size="28" font-weight="800" fill="#f4f1e8">81</text>
      <text y="30" text-anchor="middle" font-size="11" fill="#a9b0a8" letter-spacing="1.5">/ 100</text>
    </g>
    <text x="1058" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#a9b0a8" letter-spacing="3">MATCH SCORE</text>

    <!-- right side: chart -->
    <path class="areafade" d="M650 322 L650 290 C700 286 720 292 760 270 C800 248 820 262 860 240 C900 218 920 232 960 214 C1000 196 1020 216 1060 204 L1060 322 Z" fill="url(#area)"/>
    <path class="trace" pathLength="100" d="M650 290 C700 286 720 292 760 270 C800 248 820 262 860 240 C900 218 920 232 960 214 C1000 196 1020 216 1060 204" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <g>
      <circle r="5" fill="#f4f1e8"/>
      <circle class="pulse" r="5" fill="#73c998"/>
      <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.65;1" keyPoints="0;1;1" path="M650 290 C700 286 720 292 760 270 C800 248 820 262 860 240 C900 218 920 232 960 214 C1000 196 1020 216 1060 204"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#303731" stroke-width="2"/>
</svg>
